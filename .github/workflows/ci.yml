name: CI

# Quality gate for Lab DMS: backend tests + build, frontend typecheck + build,
# and a dependency vulnerability scan. Runs on every push/PR to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        working-directory: lab-dms-backend
        run: mvn -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: lab-dms-backend/target/surefire-reports
          retention-days: 14

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: lab-dms-frontend/package-lock.json

      - name: Install dependencies
        working-directory: lab-dms-frontend
        run: npm ci

      - name: Typecheck
        working-directory: lab-dms-frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: lab-dms-frontend
        run: npm run build

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backend dependencies (OWASP-style advisory scan via Trivy)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scan-ref: lab-dms-backend
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Report only for now; flip to '1' to hard-fail the build once triaged.

      - name: Frontend dependencies
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scan-ref: lab-dms-frontend
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t lab-dms-backend:ci ./lab-dms-backend

      - name: Build frontend image
        run: docker build -t lab-dms-frontend:ci ./lab-dms-frontend

      - name: Scan backend image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: lab-dms-backend:ci
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
