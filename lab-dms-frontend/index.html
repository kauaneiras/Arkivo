<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab DMS</title>
    <script>
      // Applies the saved theme before the first paint. Without this the page
      // renders light and then snaps to dark once React mounts.
      (function () {
        try {
          var saved = localStorage.getItem('lab_dms_theme') || 'system';
          var dark = saved === 'dark' || (saved === 'system'
            && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { /* private mode: fall back to light */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
